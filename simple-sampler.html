<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simpel Sampler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: dark; }
    :root {
      --bg-body: #030712;
      --bg-panel: #111827;
      --border-panel: #1f2937;
      --btn-bg: #1f2937;
      --btn-border: #374151;
      --btn-hover: #374151;
      --step-bg: #1f2937;
      --step-border: #374151;
      --step-hover: #374151;
      --step-on-green: #22c55e;
      --step-on-green-border: #4ade80;
      --step-half-green: rgba(34, 197, 94, 0.5);
      --step-half-green-border: rgba(74, 222, 128, 0.6);
      --step-on-red: #ef4444;
      --step-on-red-border: #f87171;
      --step-half-red: rgba(239, 68, 68, 0.5);
      --step-half-red-border: rgba(248, 113, 113, 0.6);
      --step-on-yellow: #eab308;
      --step-on-yellow-border: #facc15;
      --step-half-yellow: rgba(234, 179, 8, 0.5);
      --step-half-yellow-border: rgba(250, 204, 21, 0.6);
      --glow-green: rgba(34, 197, 94, 0.45);
      --glow-red: rgba(239, 68, 68, 0.45);
      --glow-yellow: rgba(234, 179, 8, 0.45);
      --step-current: #facc15;
      --drop-border: #4b5563;
      --drop-hover: #22c55e;
      --drop-bg: rgba(34, 197, 94, 0.08);
      --knob-bg: #1f2937;
      --knob-border: #374151;
      --knob-active: #4ade80;
      --knob-indicator: #22c55e;
      --dragover-color: #22c55e;
      --dragover-glow: rgba(34, 197, 94, 0.2);
      --label: #9ca3af;
      --value: #e5e7eb;
      --muted: #6b7280;
      --radius: 0.375rem;
      --radius-box: 0.75rem;
      --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body { font-family: var(--font); background-color: var(--bg-body); color: #f3f4f6; }
    .title { font-family: 'Orbitron', sans-serif; }
    .step-grid { display: grid; gap: 0.375rem; }
    .knob.inactive { opacity: 0.2; }
    #tracks .track { background-color: var(--bg-panel); border-color: var(--border-panel); border-radius: var(--radius-box); }
    .track.dragover { border-color: var(--dragover-color); box-shadow: 0 0 0 2px var(--dragover-glow); }
    .track.muted .track-name { color: var(--muted); }
    .step {
      aspect-ratio: 1;
      border-radius: var(--radius);
      background: var(--step-bg);
      border: 1px solid var(--step-border);
      transition: all 80ms ease;
      cursor: pointer;
    }
    .step:hover { background: var(--step-hover); }
    .step.on-green { background: var(--step-on-green); border-color: var(--step-on-green-border); box-shadow: 0 0 10px var(--glow-green); }
    .step.on-red { background: var(--step-on-red); border-color: var(--step-on-red-border); box-shadow: 0 0 10px var(--glow-red); }
    .step.on-yellow { background: var(--step-on-yellow); border-color: var(--step-on-yellow-border); box-shadow: 0 0 10px var(--glow-yellow); }
    .step.half-green { background: var(--step-half-green); border-color: var(--step-half-green-border); }
    .step.half-red { background: var(--step-half-red); border-color: var(--step-half-red-border); }
    .step.half-yellow { background: var(--step-half-yellow); border-color: var(--step-half-yellow-border); }
    .step.current { outline: 2px solid var(--step-current); outline-offset: 2px; }
    .drop-zone {
      border: 2px dashed var(--drop-border);
      border-radius: var(--radius);
      padding: 0.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--label);
      cursor: pointer;
      transition: all 120ms ease;
    }
    .drop-zone:hover, .drop-zone.dragover { border-color: var(--drop-hover); color: var(--drop-hover); background: var(--drop-bg); }
    .preset-row { display: flex; align-items: center; gap: 0.375rem; flex-wrap: wrap; }
    .save-btn, .preset-btn {
      height: 2.5rem;
      border-radius: var(--radius);
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--value);
      font-size: 1rem;
      cursor: pointer;
      transition: all 80ms ease;
    }
    .save-btn { padding: 0 1.5rem; font-size: 1.1rem; cursor: grab; }
    .preset-btn { width: 2.5rem; position: relative; }
    .save-btn:hover, .preset-btn:hover { background: var(--btn-hover); }
    .preset-btn.dragover { border-color: var(--drop-hover); color: var(--drop-hover); background: var(--drop-bg); }
    .preset-bin {
      height: 2.5rem;
      width: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed var(--btn-border);
      border-radius: var(--radius);
      color: var(--label);
      opacity: 0;
      pointer-events: none;
      transition: all 80ms ease;
    }
    .preset-bin.active { opacity: 1; pointer-events: auto; }
    .preset-bin.dragover { color: var(--drop-hover); border-color: var(--drop-hover); background: var(--drop-bg); }
    .preset-bin svg { width: 55%; height: 55%; }
    .preset-edge { position: absolute; transform: translate(-50%, -50%); pointer-events: none; }
    .p-knob { width: 0.4rem; height: 0.4rem; border-radius: 50%; background: var(--knob-bg); border: 1px solid var(--knob-border); }
    .p-knob-ind {
      position: absolute;
      width: 1px;
      height: 0.18rem;
      background: var(--knob-indicator);
      top: 1px;
      left: 50%;
      transform-origin: bottom center;
      border-radius: 1px;
    }
    .p-sq { width: 0.25rem; height: 0.25rem; border-radius: 1px; box-sizing: border-box; }
    footer .bg-gray-900 { background-color: var(--bg-panel); border-color: var(--border-panel); border-radius: var(--radius-box); }
    footer .bg-gray-800, button.default-btn, button.mute-btn {
      background-color: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: var(--radius);
      color: var(--value);
    }
    footer .bg-gray-800:hover, button.default-btn:hover, button.mute-btn:hover { background-color: var(--btn-hover); }
    #playBtn { border-radius: var(--radius); }
    .knob-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.5rem 0.75rem; justify-items: center; padding-bottom: 22px; }
    .knob {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      position: relative;
      background: var(--knob-bg);
      border: 3px solid var(--knob-border);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: ns-resize;
      transition: border-color 80ms ease;
    }
    .knob:active { border-color: var(--knob-active); }
    .knob-indicator {
      position: absolute;
      width: 4px;
      height: 24px;
      background: var(--knob-indicator);
      top: 6px;
      left: 50%;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(-135deg);
      border-radius: 2px;
      pointer-events: none;
    }
    .knob-label {
      position: absolute;
      bottom: -18px;
      width: 100%;
      text-align: center;
      font-size: 10px;
      color: var(--label);
      pointer-events: none;
    }
    .knob-value {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 11px;
      font-weight: bold;
      color: var(--value);
      pointer-events: none;
    }
    input[type=range] { accent-color: var(--knob-indicator); }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center p-4 md:p-8">

  <header class="w-full mb-8">
    <h1 class="text-3xl font-extrabold tracking-tight title">Simpel Sampler</h1>
  </header>

  <main id="tracks" class="w-full space-y-5">
    <!-- Tracks werden hier generiert -->
  </main>

  <footer class="mt-10 flex flex-col items-center gap-4">
    <div class="flex flex-wrap items-center justify-center gap-3">
      <button id="playBtn" class="w-14 h-12 rounded-lg bg-green-600 hover:bg-green-500 shadow transition flex items-center justify-center">
        <svg width='28' height='28' viewBox='0 0 24 24' fill='currentColor'><polygon points='5,3 21,12 5,21'></polygon></svg>
      </button>
      <button id='clearBtn' class='px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 font-medium transition'>Clear</button>
      <div class="flex items-center gap-2 bg-gray-900 px-3 py-2 rounded-lg border border-gray-800">
        <label for="bpm" class="text-sm text-gray-400">BPM</label>
        <input id="bpm" type="range" min="60" max="200" value="120" class="w-32">
        <span id="bpmVal" class="text-sm font-mono w-8">120</span>
      </div>

    </div>
  </footer>

<script>
(function() {
  'use strict';

  // ---------- Audio Context ----------
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  const audioCtx = new AudioContext();

  // ---------- Helpers ----------
  function lerp(a, b, t) { return a + (b - a) * t; }

  function expandSteps(pattern, len) {
    return new Array(len).fill(false).map((_, i) => pattern[i % pattern.length]);
  }

  function makeDistortionCurve(amount) {
    const samples = 4096;
    const curve = new Float32Array(samples);
    const k = 1 + amount * 20;
    for (let i = 0; i < samples; i++) {
      const x = i * 2 / samples - 1;
      curve[i] = Math.tanh(k * x);
    }
    return curve;
  }

  // ---------- Synthesizer (Default Sounds) ----------
  const waveTypes = ['sine', 'triangle', 'sawtooth', 'square'];
  function waveAt(v) {
    return waveTypes[Math.min(waveTypes.length - 1, Math.floor(v * waveTypes.length))];
  }

  const playIcon = `<svg width='28' height='28' viewBox='0 0 24 24' fill='currentColor'><polygon points='5,3 21,12 5,21'></polygon></svg>`;
  const stopIcon = `<svg width='28' height='28' viewBox='0 0 24 24' fill='currentColor'><rect x='4' y='4' width='16' height='16' rx='2'></rect></svg>`;

  function playKick(ctx, time, track, stepGain = 1, destination = ctx.destination) {
    const p = track.params;
    const gain = track.params.gain * stepGain;
    const startFreq = lerp(40, 300, p.pitch);
    const endFreq = lerp(10, startFreq, 1 - p.bend);
    const decay = lerp(0.05, 1.5, p.decay);
    const timbre = p.timbre;

    const osc1 = ctx.createOscillator();
    osc1.type = 'sine';
    const g1 = ctx.createGain();
    osc1.frequency.setValueAtTime(startFreq, time);
    osc1.frequency.exponentialRampToValueAtTime(Math.max(0.01, endFreq), time + decay);
    g1.gain.setValueAtTime(gain * (1 - timbre), time);
    g1.gain.exponentialRampToValueAtTime(0.001, time + decay);
    osc1.connect(g1).connect(destination);
    osc1.start(time);
    osc1.stop(time + decay);

    if (timbre > 0) {
      const osc2 = ctx.createOscillator();
      osc2.type = 'triangle';
      const g2 = ctx.createGain();
      osc2.frequency.setValueAtTime(startFreq, time);
      osc2.frequency.exponentialRampToValueAtTime(Math.max(0.01, endFreq), time + decay);
      g2.gain.setValueAtTime(gain * timbre * 0.7, time);
      g2.gain.exponentialRampToValueAtTime(0.001, time + decay);
      osc2.connect(g2).connect(destination);
      osc2.start(time);
      osc2.stop(time + decay);
    }

    if (p.punch > 0) {
      const clickDur = 0.04;
      const buf = ctx.createBuffer(1, ctx.sampleRate * clickDur, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const click = ctx.createBufferSource();
      click.buffer = buf;
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 1000;
      const gClick = ctx.createGain();
      gClick.gain.setValueAtTime(gain * p.punch * 0.8, time);
      gClick.gain.exponentialRampToValueAtTime(0.001, time + clickDur);
      click.connect(hp).connect(gClick).connect(destination);
      click.start(time);
      click.stop(time + clickDur);
    }
  }

  function playSnare(ctx, time, track, stepGain = 1, destination = ctx.destination) {
    const p = track.params;
    const gain = track.params.gain * stepGain;
    const toneFreq = lerp(80, 400, p.tone);
    const decay = lerp(0.05, 1.0, p.decay);

    const osc = ctx.createOscillator();
    osc.type = waveAt(p.wave);
    const g1 = ctx.createGain();
    osc.frequency.setValueAtTime(toneFreq, time);
    g1.gain.setValueAtTime(gain * 0.6, time);
    g1.gain.exponentialRampToValueAtTime(0.001, time + decay);
    osc.connect(g1).connect(destination);
    osc.start(time);
    osc.stop(time + decay + 0.05);

    const noiseFilter = lerp(500, 10000, p.snap);
    const noiseGain = lerp(0, 1.8, p.noise);
    if (noiseGain > 0) {
      const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * (decay + 0.1), ctx.sampleRate);
      const noiseData = noiseBuf.getChannelData(0);
      for (let i = 0; i < noiseData.length; i++) noiseData[i] = Math.random() * 2 - 1;
      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuf;
      const filter = ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = noiseFilter;
      filter.Q.value = 0.7;
      const g2 = ctx.createGain();
      g2.gain.setValueAtTime(gain * noiseGain, time);
      g2.gain.exponentialRampToValueAtTime(0.001, time + decay);
      noise.connect(filter).connect(g2).connect(destination);
      noise.start(time);
      noise.stop(time + decay + 0.05);
    }
  }

  function playHiHat(ctx, time, track, stepGain = 1, destination = ctx.destination) {
    const p = track.params;
    const gain = track.params.gain * stepGain;
    const cutoff = lerp(2000, 16000, p.pitch);
    const q = lerp(0, 30, p.resonance);
    const decay = lerp(0.02, 0.8, p.decay);
    const bodyFreq = lerp(1000, 8000, p.body);
    const mix = p.mix;

    const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * (decay + 0.05), ctx.sampleRate);
    const noiseData = noiseBuf.getChannelData(0);
    for (let i = 0; i < noiseData.length; i++) noiseData[i] = Math.random() * 2 - 1;

    const noise = ctx.createBufferSource();
    noise.buffer = noiseBuf;

    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = cutoff;
    hp.Q.value = q;
    const g1 = ctx.createGain();
    noise.connect(hp).connect(g1).connect(destination);

    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = bodyFreq;
    bp.Q.value = q;
    const g2 = ctx.createGain();
    noise.connect(bp).connect(g2).connect(destination);

    g1.gain.setValueAtTime(gain * (1 - mix) * 0.8, time);
    g1.gain.exponentialRampToValueAtTime(0.001, time + decay);
    g2.gain.setValueAtTime(gain * mix * 0.8, time);
    g2.gain.exponentialRampToValueAtTime(0.001, time + decay);

    noise.start(time);
    noise.stop(time + decay + 0.05);
  }

  // ---------- State ----------
  const numSteps = 16;
  const tracks = [
    {
      id: 0,
      name: 'Kick',
      color: 'green',
      steps: [true,false,false,false, true,false,false,false, true,false,false,false, true,false,false,false],

      params: { pitch: 0.25, bend: 0.8, decay: 0.4, timbre: 0.0, punch: 0.3, gain: 1.0, distortion: 0.0 },
      defaultName: 'Kick', defaultSynth: playKick, defaultParams: { pitch: 0.25, bend: 0.8, decay: 0.4, timbre: 0.0, punch: 0.3, gain: 1.0, distortion: 0.0 },
      knobs: [
        { key: 'pitch', label: 'Pitch' },
        { key: 'bend', label: 'Bend' },
        { key: 'decay', label: 'Decay' },
        { key: 'timbre', label: 'Timbre' },
        { key: 'punch', label: 'Punch' },
        { key: 'gain', label: 'Vol' },
        { key: 'distortion', label: 'Dist' }
      ],
      muted: false,
      buffer: null,
      presets: [],
      patternPresets: [],
      synth: playKick
    },
    {
      id: 1,
      name: 'Snare',
      color: 'red',
      steps: [false,false,false,false, true,false,false,false, false,false,false,false, true,false,false,false],

      params: { tone: 0.3, wave: 0.3, snap: 0.15, noise: 0.7, decay: 0.35, gain: 1.0, distortion: 0.0 },
      defaultName: 'Snare', defaultSynth: playSnare, defaultParams: { tone: 0.3, wave: 0.3, snap: 0.15, noise: 0.7, decay: 0.35, gain: 1.0, distortion: 0.0 },
      knobs: [
        { key: 'tone', label: 'Tone' },
        { key: 'wave', label: 'Wave', display: v => waveAt(v) },
        { key: 'snap', label: 'Snap' },
        { key: 'noise', label: 'Noise' },
        { key: 'decay', label: 'Decay' },
        { key: 'gain', label: 'Vol' },
        { key: 'distortion', label: 'Dist' }
      ],
      muted: false,
      buffer: null,
      presets: [],
      patternPresets: [],
      synth: playSnare
    },
    {
      id: 2,
      name: 'Hi-Hat',
      color: 'yellow',
      steps: [true,false,true,false, true,false,true,false, true,false,true,false, true,false,true,false],

      params: { pitch: 0.45, resonance: 0.2, decay: 0.15, body: 0.4, mix: 0.2, gain: 0.7, distortion: 0.0 },
      defaultName: 'Hi-Hat', defaultSynth: playHiHat, defaultParams: { pitch: 0.45, resonance: 0.2, decay: 0.15, body: 0.4, mix: 0.2, gain: 0.7, distortion: 0.0 },
      knobs: [
        { key: 'pitch', label: 'Pitch' },
        { key: 'resonance', label: 'Reso' },
        { key: 'decay', label: 'Decay' },
        { key: 'body', label: 'Body' },
        { key: 'mix', label: 'Mix' },
        { key: 'gain', label: 'Vol' },
        { key: 'distortion', label: 'Dist' }
      ],
      muted: false,
      buffer: null,
      presets: [],
      patternPresets: [],
      synth: playHiHat
    }
  ];

  let bpm = 120;
  let isPlaying = false;
  let currentStep = 0;
  let nextNoteTime = 0.0;
  let timerID = null;
  const lookahead = 25.0;
  const scheduleAheadTime = 0.1;

  // ---------- Playback helpers ----------
  function playTrack(track, time, stepGain = 1) {
    if (track.muted) return;
    const dist = audioCtx.createWaveShaper();
    dist.curve = makeDistortionCurve(track.params.distortion);
    dist.oversample = '4x';
    dist.connect(audioCtx.destination);
    if (track.buffer) {
      const source = audioCtx.createBufferSource();
      source.buffer = track.buffer;
      const tuneParam = track.params.pitch !== undefined ? track.params.pitch : (track.params.tone !== undefined ? track.params.tone : 0.5);
      source.playbackRate.value = lerp(0.5, 2.0, tuneParam);
      const g = audioCtx.createGain();
      const decay = lerp(0.05, 2.0, track.params.decay);
      g.gain.setValueAtTime(track.params.gain * stepGain, time);
      g.gain.exponentialRampToValueAtTime(0.001, time + decay);
      source.connect(g).connect(dist);
      source.start(time);
      source.stop(time + decay);
    } else if (track.synth) {
      track.synth(audioCtx, time, track, stepGain, dist);
    }
  }

  function nextNote() {
    const secondsPerBeat = 60.0 / bpm;
    const secondsPerStep = secondsPerBeat / 4.0;
    nextNoteTime += secondsPerStep;
    currentStep++;
    if (currentStep >= numSteps) currentStep = 0;
  }

  function scheduleNote(step, time) {
    tracks.forEach(track => {
      if (track.steps[step]) playTrack(track, time, track.steps[step]);
    });
  }

  function scheduler() {
    while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
      scheduleNote(currentStep, nextNoteTime);
      updateStepVisual(currentStep);
      nextNote();
    }
  }

  // ---------- Visual helpers ----------
  const trackEls = []; // { root, stepButtons: [] }

  function updateStepVisual(step) {
    document.querySelectorAll('.step.current').forEach(el => el.classList.remove('current'));
    document.querySelectorAll(`.step[data-step="${step}"]`).forEach(el => el.classList.add('current'));
  }

  function updateStepButton(btn, track, step) {
    const v = Number(track.steps[step]);
    btn.className = `step ${v === 1 ? 'on-' + track.color : ''} ${v === 0.25 ? 'half-' + track.color : ''}`;
    btn.dataset.step = step;
    btn.dataset.track = track.id;
  }

  let draggedPreset = null; // { presets, index, rerender } while a preset button is being dragged

  // Position of the i-th of n decorations on a ring just inside the button edge,
  // clockwise starting from the top-left corner.
  function edgePos(i, n) {
    const a = 0.12;
    const p = v => ((a + (1 - 2 * a) * v) * 100) + '%';
    const t = ((i / n) * 4) % 4;
    const s = Math.floor(t);
    const u = t - s;
    if (s === 0) return { left: p(u), top: p(0) };
    if (s === 1) return { left: p(1), top: p(u) };
    if (s === 2) return { left: p(1 - u), top: p(1) };
    return { left: p(0), top: p(1 - u) };
  }

  function renderPresetRow(track, row, label, presets, snapshot, restore, decorate) {
    row.innerHTML = '';

    const saveBtn = document.createElement('button');
    saveBtn.className = 'save-btn';
    saveBtn.textContent = label;
    saveBtn.title = label + ' speichern (auf Zahl ziehen zum Überschreiben)';
    saveBtn.draggable = true;
    saveBtn.addEventListener('click', () => {
      presets.push(snapshot());
      renderPresetRow(track, row, label, presets, snapshot, restore, decorate);
      saveState();
    });
    saveBtn.addEventListener('dragstart', e => {
      e.dataTransfer.setData('application/x-preset-save', '');
      e.dataTransfer.effectAllowed = 'copy';
    });
    row.appendChild(saveBtn);

    const binEl = document.createElement('div');
    binEl.className = 'preset-bin';
    binEl.title = 'Hierher ziehen zum Löschen';
    binEl.innerHTML = `<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>
      <polyline points='3 6 5 6 21 6'></polyline>
      <path d='M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2'></path>
      <line x1='10' y1='11' x2='10' y2='17'></line>
      <line x1='14' y1='11' x2='14' y2='17'></line>
    </svg>`;
    binEl.addEventListener('dragover', e => {
      if (draggedPreset) {
        e.preventDefault();
        binEl.classList.add('dragover');
      }
    });
    binEl.addEventListener('dragleave', () => binEl.classList.remove('dragover'));
    binEl.addEventListener('drop', e => {
      e.preventDefault();
      e.stopPropagation();
      binEl.classList.remove('dragover');
      if (!draggedPreset) return;
      draggedPreset.presets.splice(draggedPreset.index, 1);
      draggedPreset.rerender();
      draggedPreset = null;
      saveState();
    });

    presets.forEach((preset, i) => {
      const b = document.createElement('button');
      b.className = 'preset-btn';
      b.textContent = i + 1;
      b.title = 'Klicken zum Laden, in den Papierkorb ziehen zum Löschen';
      b.draggable = true;
      b.addEventListener('dragstart', e => {
        draggedPreset = {
          presets, index: i,
          rerender: () => renderPresetRow(track, row, label, presets, snapshot, restore, decorate)
        };
        e.dataTransfer.setData('application/x-preset-del', '');
        e.dataTransfer.effectAllowed = 'move';
        binEl.classList.add('active');
      });
      b.addEventListener('dragend', () => {
        draggedPreset = null;
        binEl.classList.remove('active');
      });
      b.addEventListener('click', () => {
        restore(preset);
        renderTracks();
        saveState();
      });
      b.addEventListener('dragover', e => {
        if (e.dataTransfer.types.includes('application/x-preset-save')) {
          e.preventDefault();
          b.classList.add('dragover');
        }
      });
      b.addEventListener('dragleave', () => b.classList.remove('dragover'));
      b.addEventListener('drop', e => {
        if (!e.dataTransfer.types.includes('application/x-preset-save')) return;
        e.preventDefault();
        e.stopPropagation();
        b.classList.remove('dragover');
        presets[i] = snapshot();
        renderPresetRow(track, row, label, presets, snapshot, restore, decorate);
        saveState();
      });
      if (decorate) decorate(b, preset);
      row.appendChild(b);
    });

    row.appendChild(binEl);
  }

  // ---------- UI rendering ----------
  function renderTracks() {
    const container = document.getElementById('tracks');
    container.innerHTML = '';

    tracks.forEach(track => {
      const root = document.createElement('div');
      root.className = 'track bg-gray-900 rounded-xl border border-gray-800 p-4 flex flex-col lg:flex-row gap-4' + (track.muted ? ' muted' : '');

      // Info column: name, file input, mute
      const infoCol = document.createElement('div');
      infoCol.className = 'flex flex-col gap-3 w-full lg:w-48';
      infoCol.innerHTML = `
        <div class="flex items-center justify-between gap-2 flex-wrap">
          <button class="track-name font-bold text-${track.color}-400 text-lg text-left bg-transparent border-0 p-0 cursor-pointer hover:opacity-80" title="Klicken, um Sound auszuwählen">${track.name}</button>
          <div class="flex items-center gap-2">
            <button class="default-btn text-xs px-2 py-1 rounded bg-gray-800 hover:bg-gray-700 border border-gray-700">Default</button>
            <button class="mute-btn text-xs px-2 py-1 rounded bg-gray-800 hover:bg-gray-700 border border-gray-700">${track.muted ? 'Unmute' : 'Mute'}</button>
          </div>
        </div>
        <input type="file" accept="audio/*" class="hidden file-input">
      `;

      // Knob column
      const knobCol = document.createElement('div');
      knobCol.className = 'knob-col w-full lg:w-80';
      knobCol.innerHTML = `
        <div class="knob-row">
          ${track.knobs.map(k => `
            <div class="knob knob-data" data-key="${k.key}" aria-label="${k.label}">
              <div class="knob-indicator"></div>
              <div class="knob-label">${k.label}</div>
              <div class="knob-value">0</div>
            </div>
          `).join('')}
        </div>
      `;

      // Steps
      const stepsContainer = document.createElement('div');
      stepsContainer.className = 'steps step-grid flex-1';
      stepsContainer.style.gridTemplateColumns = `repeat(${numSteps}, minmax(0, 1fr))`;
      const stepButtons = [];
      for (let s = 0; s < numSteps; s++) {
        const btn = document.createElement('button');
        updateStepButton(btn, track, s);
        btn.addEventListener('click', () => {
          const v = Number(track.steps[s]);
          track.steps[s] = v === 0 ? 1 : (v === 1 ? 0.25 : 0);
          updateStepButton(btn, track, s);
          saveState();
        });
        stepsContainer.appendChild(btn);
        stepButtons.push(btn);
      }

      // Preset rows under the steps: sound settings + step pattern
      const soundRow = document.createElement('div');
      soundRow.className = 'preset-row';
      renderPresetRow(track, soundRow, 'Sound', track.presets,
        () => ({ ...track.params }),
        preset => { track.params = { ...preset }; },
        (b, preset) => {
          track.knobs.forEach((kn, i, arr) => {
            const k = document.createElement('span');
            k.className = 'p-knob preset-edge';
            const pos = edgePos(i, arr.length);
            k.style.left = pos.left;
            k.style.top = pos.top;
            const ind = document.createElement('span');
            ind.className = 'p-knob-ind';
            ind.style.transform = `translateX(-50%) rotate(${-135 + (preset[kn.key] || 0) * 270}deg)`;
            k.appendChild(ind);
            b.appendChild(k);
          });
        });

      const patternRow = document.createElement('div');
      patternRow.className = 'preset-row';
      renderPresetRow(track, patternRow, 'Pattern', track.patternPresets,
        () => [...track.steps],
        preset => { track.steps = expandSteps(preset, numSteps); },
        (b, preset) => {
          preset.forEach((v, i, arr) => {
            const sq = document.createElement('span');
            sq.className = 'p-sq preset-edge';
            const pos = edgePos(i, arr.length);
            sq.style.left = pos.left;
            sq.style.top = pos.top;
            if (Number(v) === 1) sq.style.background = `var(--step-on-${track.color})`;
            else if (v) sq.style.background = `var(--step-half-${track.color})`;
            else { sq.style.background = 'var(--step-bg)'; sq.style.border = '1px solid var(--step-border)'; }
            b.appendChild(sq);
          });
        });

      const stepsCol = document.createElement('div');
      stepsCol.className = 'flex-1 flex flex-col gap-2';
      stepsCol.appendChild(stepsContainer);
      stepsCol.appendChild(soundRow);
      stepsCol.appendChild(patternRow);

      root.appendChild(infoCol);
      root.appendChild(knobCol);
      root.appendChild(stepsCol);
      container.appendChild(root);

      // Mute
      const muteBtn = root.querySelector('.mute-btn');
      muteBtn.addEventListener('click', () => {
        track.muted = !track.muted;
        muteBtn.textContent = track.muted ? 'Unmute' : 'Mute';
        root.classList.toggle('muted', track.muted);
        saveState();
      });

      // Default
      const defaultBtn = root.querySelector('.default-btn');
      defaultBtn.addEventListener('click', () => {
        track.params = { ...track.defaultParams };
        track.buffer = null;
        track.sampleData = null;
        track.synth = track.defaultSynth;
        track.name = track.defaultName;
        renderTracks();
        saveState();
      });

      // Knobs
      root.querySelectorAll('.knob').forEach(knobEl => {
        const key = knobEl.dataset.key;
        const knobDef = track.knobs.find(k => k.key === key);
        if (knobDef) attachKnob(knobEl, track, knobDef);
      });

      // Drag & drop / file input
      const trackNameBtn = root.querySelector('.track-name');
      const fileInput = root.querySelector('.file-input');
      trackNameBtn.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', e => {
        const file = e.target.files[0];
        if (file) loadSample(file, track, root);
      });

      // Whole track is a drop target
      let dragCounter = 0;
      root.addEventListener('dragenter', e => {
        if (!e.dataTransfer.types.includes('Files')) return;
        dragCounter++;
        root.classList.add('dragover');
      });
      root.addEventListener('dragleave', e => {
        if (!e.dataTransfer.types.includes('Files')) return;
        dragCounter--;
        if (dragCounter === 0) root.classList.remove('dragover');
      });
      root.addEventListener('dragover', e => e.preventDefault());
      root.addEventListener('drop', e => {
        e.preventDefault();
        e.stopPropagation();
        dragCounter = 0;
        root.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file) loadSample(file, track, root);
      });

      updateKnobActivity(track, root);

      trackEls.push({ root, stepButtons });
    });
  }

  // ---------- Knob helpers ----------
  function attachKnob(el, track, knobDef) {
    const indicator = el.querySelector('.knob-indicator');
    const valueLabel = el.querySelector('.knob-value');
    const param = knobDef.key;

    function update() {
      const v = track.params[param];
      const angle = -135 + v * 270;
      indicator.style.transform = `translateX(-50%) rotate(${angle}deg)`;
      valueLabel.textContent = knobDef.display ? knobDef.display(v) : Math.round(v * 100);
    }
    update();

    let startY = 0;
    let startValue = 0;
    const sensitivity = 120;

    function onMove(e) {
      e.preventDefault();
      const delta = startY - e.clientY;
      let newVal = startValue + delta / sensitivity;
      newVal = Math.max(0, Math.min(1, newVal));
      track.params[param] = newVal;
      update();
    }

    function onEnd() {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onEnd);
      document.removeEventListener('pointercancel', onEnd);
      saveState();
    }

    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (el.setPointerCapture) el.setPointerCapture(e.pointerId);
      startY = e.clientY;
      startValue = track.params[param];
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onEnd);
      document.addEventListener('pointercancel', onEnd);
    });
  }

  // ---------- Knob activity ----------
  function updateKnobActivity(track, root) {
    const tuneParam = track.params.pitch !== undefined ? 'pitch' : 'tone';
    const activeParams = [tuneParam, 'decay', 'gain', 'distortion'];
    root.querySelectorAll('.knob').forEach(knobEl => {
      const key = knobEl.dataset.key;
      knobEl.classList.toggle('inactive', !!track.buffer && !activeParams.includes(key));
    });
  }

  // ---------- Sample loading ----------
  async function loadSample(file, track, root) {
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    try {
      const arrayBuffer = await file.arrayBuffer();
      track.sampleData = arrayBuffer.slice(0);
      const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
      track.buffer = audioBuffer;
      track.synth = null;
      track.name = file.name;
      root.querySelector('.track-name').textContent = file.name;
      updateKnobActivity(track, root);
      saveState();
    } catch (err) {
      alert('Konnte Sound nicht laden: ' + file.name);
      console.error(err);
    }
  }

  // ---------- Persistence helpers ----------
  function arrayBufferToBase64(buffer) {
    const bytes = new Uint8Array(buffer);
    let binary = '';
    for (let i = 0; i < bytes.byteLength; i++) {
      binary += String.fromCharCode(bytes[i]);
    }
    return window.btoa(binary);
  }

  function base64ToArrayBuffer(base64) {
    const binary = window.atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    return bytes.buffer;
  }

  function saveState() {
    const data = {
      bpm,
      tracks: tracks.map(track => {
        const t = {
          id: track.id,
          name: track.name,
          steps: track.steps,
          params: track.params,
          presets: track.presets,
          patternPresets: track.patternPresets,
          muted: track.muted,
          sample: null
        };
        if (track.sampleData) {
          try {
            t.sample = arrayBufferToBase64(track.sampleData);
          } catch (e) {
            console.warn('Sample too large to persist', e);
          }
        }
        return t;
      })
    };
    try {
      localStorage.setItem('simpelSamplerState', JSON.stringify(data));
    } catch (e) {
      // fallback: try without samples
      const minimal = { ...data, tracks: data.tracks.map(t => ({ ...t, sample: null })) };
      try {
        localStorage.setItem('simpelSamplerState', JSON.stringify(minimal));
      } catch (e2) {
        console.warn('Could not save sampler state', e2);
      }
    }
  }

  async function loadState() {
    const raw = localStorage.getItem('simpelSamplerState');
    if (!raw) return;
    try {
      const data = JSON.parse(raw);
      if (data.bpm) {
        bpm = data.bpm;
        bpmInput.value = bpm;
        bpmVal.textContent = bpm;
      }

      for (const st of data.tracks) {
        const track = tracks.find(t => t.id === st.id);
        if (!track) continue;
        if (st.muted !== undefined) track.muted = st.muted;
        if (st.steps) track.steps = st.steps;
        if (track.steps.length < numSteps) {
          track.steps = [...track.steps, ...new Array(numSteps - track.steps.length).fill(false)];
        } else if (track.steps.length > numSteps) {
          track.steps = track.steps.slice(0, numSteps);
        }
        if (st.params) track.params = { ...track.params, ...st.params };
        if (st.presets) track.presets = st.presets;
        if (st.patternPresets) track.patternPresets = st.patternPresets;
        if (st.sample) {
          try {
            track.sampleData = base64ToArrayBuffer(st.sample);
            track.buffer = await audioCtx.decodeAudioData(track.sampleData);
            track.synth = null;
            if (st.name) track.name = st.name;
          } catch (err) {
            console.warn('Could not restore sample for track', track.id, err);
            track.sampleData = null;
            track.buffer = null;
          }
        }
      }
    } catch (err) {
      console.error('Failed to load sampler state', err);
    }
  }

  // ---------- Controls ----------
  const playBtn = document.getElementById('playBtn');
  const clearBtn = document.getElementById('clearBtn');
  const bpmInput = document.getElementById('bpm');
  const bpmVal = document.getElementById('bpmVal');

  async function startPlayback() {
    if (isPlaying) return;
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    isPlaying = true;
    currentStep = 0;
    nextNoteTime = audioCtx.currentTime + 0.05;
    timerID = setInterval(scheduler, lookahead);
    playBtn.innerHTML = stopIcon;
    playBtn.classList.replace('bg-green-600', 'bg-red-600');
    playBtn.classList.replace('hover:bg-green-500', 'hover:bg-red-500');
  }

  function stopPlayback() {
    isPlaying = false;
    clearInterval(timerID);
    document.querySelectorAll('.step.current').forEach(el => el.classList.remove('current'));
    playBtn.innerHTML = playIcon;
    playBtn.classList.replace('bg-red-600', 'bg-green-600');
    playBtn.classList.replace('hover:bg-red-500', 'hover:bg-green-500');
  }

  playBtn.addEventListener('click', async () => {
    if (isPlaying) stopPlayback();
    else await startPlayback();
  });

  clearBtn.addEventListener('click', () => {
    tracks.forEach(track => track.steps = new Array(numSteps).fill(0));
    renderTracks();
    saveState();
  });

  bpmInput.addEventListener('input', e => {
    bpm = parseInt(e.target.value, 10);
    bpmVal.textContent = bpm;
    saveState();
  });



  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      playBtn.click();
    }
  });

  // Prevent browser from opening dropped files outside drop zones
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => e.preventDefault());

  (async () => {
    await loadState();
    renderTracks();
  })();
})();
</script>
</body>
</html>
