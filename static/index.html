<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simpel Sampler</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/ui.js"></script>
</head>
<body>

  <!-- Browsers only allow audio after a click, so everyone joins explicitly -->
  <div id="joinOverlay" class="join-overlay">
    <button id="joinBtn" class="btn join-btn">Join</button>
  </div>

  <header class="app-header">
    <h1 class="title">Simpel Sampler</h1>
    <button id="shareBtn" class="btn btn-sm">Copy room link</button>
  </header>

  <main id="tracks">
  </main>
  <div id="addBar" class="add-bar"></div>

  <footer class="app-footer">
    <div class="controls">
      <button id="playBtn">
        <svg width='28' height='28' viewBox='0 0 24 24' fill='currentColor'><polygon points='5,3 21,12 5,21'></polygon></svg>
      </button>
      <button id='clearBtn' class='btn'>Clear</button>
      <div class="bpm-control panel">
        <label for="bpm">BPM</label>
        <input id="bpm" type="range" min="60" max="200" value="120">
        <span id="bpmVal">120</span>
      </div>
    </div>
  </footer>
</body>
</html>
